name: Setup Services
on:
    push:
        branches:
            - main
        paths:
            - 'deploy/hosts.yml'
            - 'deploy/setup_services.yml'
            - 'deploy/services/**'
jobs:
    setupServices:
        name: Sets up services on the server with Ansible
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
            - name: Run ansible
              uses: dawidd6/action-ansible-playbook@v9
              with:
                  directory: deploy
                  playbook: setup_services.yml
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
                  options: |
                      --inventory hosts.yml
                      --extra-vars cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}
                      --extra-vars cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}
                      --extra-vars restic_password=${{ secrets.RESTIC_PASSWORD }}
                      --extra-vars restic_s3_endpoint=${{ secrets.RESTIC_S3_ENDPOINT }}
                      --extra-vars restic_s3_bucket_name=${{ secrets.RESTIC_S3_BUCKET_NAME }}
                      --extra-vars restic_s3_access_key_id=${{ secrets.RESTIC_S3_ACCESS_KEY_ID }}
                      --extra-vars restic_s3_secret_key=${{ secrets.RESTIC_S3_SECRET_KEY }}
                      --extra-vars extendedmind_server_metrics_secret=${{ secrets.EXTENDEDMIND_SERVER_METRICS_SECRET }}
